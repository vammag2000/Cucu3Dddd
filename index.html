<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Гидравлический пресс</title>
<style>
  body { margin:0; overflow:hidden; background:#141414; font-family:sans-serif; touch-action:none; }
  #canvas-container { width:100vw; height:100vh; display:block; }
  #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             color:#fff; font-size:18px; text-align:center; padding:0 20px; }
  #crush-btn {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    padding:15px 40px; font-size:20px; font-weight:bold; color:#fff;
    background:#ff4757; border:none; border-radius:30px;
    box-shadow:0 4px 15px rgba(255,71,87,.4); cursor:pointer; z-index:10;
  }
  #crush-btn:active { transform:translateX(-50%) scale(0.95); background:#ff6b81; }
  #crush-btn:disabled { background:#444; box-shadow:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">Загрузка модели...</div>
<div id="canvas-container"></div>
<button id="crush-btn" disabled>Давить</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Рендерер ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ---------- Сцена ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141414);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- Камера ----------
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI/2 - 0.02;

// ---------- Свет ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 0.8));

const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.bias = -0.0005;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x88aaff, 0.6);
fillLight.position.set(-6, 5, -6);
scene.add(fillLight);

// ---------- Земля ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color:0x2a2a2a, roughness:0.92, metalness:0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Состояние ----------
let wall1=null, wall2=null;
let isCrushing = false, hasCollided = false;
let audioCtx = null;
let shakeAmt = 0;

// Настройки движения
let startX1 = -4, startX2 = 4;
let targetX1 = 0, targetX2 = 0;
let progress = 0; // 0 = раздвинуто, 1 = сжато
const SPEED = 1.5; // Скорость сжатия (1.5 = сжимается за ~0.7 сек)

// ---------- Загрузка ----------
new GLTFLoader().load('./model.glb', (gltf) => {
  const src = gltf.scene;

  // 1. Центрируем модель идеально в нуле координат
  const box = new THREE.Box3().setFromObject(src);
  const size = new THREE.Vector3();  box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  src.position.sub(center); // Сдвигаем модель так, чтобы её центр был ровно на (0,0,0)

  src.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) o.material.envMapIntensity = 1.0;
    }
  });

  // 2. Вычисляем дистанцию, на которой шипы соприкоснутся
  // size.x — это общая ширина стены вместе с шипами.
  // Чтобы шипы встретились, левая стена должна сдвинуться на size.x / 2, и правая тоже.
  const wallHalfWidth = size.x / 2;
  targetX1 = -wallHalfWidth; 
  targetX2 =  wallHalfWidth;

  // Стартовые позиции (далеко друг от друга)
  startX1 = -wallHalfWidth - 2.5;
  startX2 =  wallHalfWidth + 2.5;

  // 3. Создаем левую стену
  wall1 = new THREE.Group();
  wall1.add(src);
  wall1.position.set(startX1, 0, 0); // Y=0, Z=0 — строго на оси
  scene.add(wall1);

  // 4. Создаем правую стену (клон)
  const clone = src.clone(true);
  clone.traverse(o => { if (o.isMesh && o.material) o.material = o.material.clone(); });
  
  wall2 = new THREE.Group();
  wall2.add(clone);
  // Разворачиваем на 180 градусов вокруг Y, чтобы шипы смотрели влево (навстречу)
  wall2.rotation.y = Math.PI; 
  wall2.position.set(startX2, 0, 0);
  scene.add(wall2);

  // 5. Настройка камеры и света под размеры модели
  const camDist = Math.max(6, size.y * 2, size.x * 3);
  camera.position.set(0, size.y * 0.5, camDist);
  controls.target.set(0, 0, 0);
  controls.minDistance = size.x;
  controls.maxDistance = camDist * 3;

  const fit = Math.max(size.x, size.y, size.z) * 2.5;
  const sc = dirLight.shadow.camera;
  sc.left = -fit; sc.right = fit; sc.top = fit; sc.bottom = -fit;
  sc.near = 0.1; sc.far = fit*6; sc.updateProjectionMatrix();
  dirLight.position.set(fit, fit*1.5, fit*1.2);

  // Включаем кнопку
  document.getElementById('loading').style.display = 'none';
  const btn = document.getElementById('crush-btn');
  btn.disabled = false;

  btn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isCrushing = !isCrushing;
    if (isCrushing) hasCollided = false;
    btn.innerText = isCrushing ? 'Раздвинуть' : 'Давить';
  });
},
(xhr) => {
  if (xhr.total) {
    document.getElementById('loading').innerText =
      `Загрузка: ${Math.round(xhr.loaded/xhr.total*100)}%`;
  }
},
(err) => {
  console.error(err);
  document.getElementById('loading').innerText = 'Ошибка загрузки model.glb.';
});

// ---------- Эффекты при ударе ----------
function onImpact() {
  shakeAmt = 0.25; // Тряска
  spawnDust();     // Пыль/искры
  playImpactSound(); // Звук
}

function spawnDust() {
  const N = 60;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const vel = [];
  // Берем высоту по центру столкновения
  for (let i=0; i<N; i++) {
    pos[i*3]   = (Math.random()-0.5)*0.5;
    pos[i*3+1] = (Math.random()-0.5)*2.0; // Разлетаются по высоте
    pos[i*3+2] = (Math.random()-0.5)*0.5;
    vel.push(new THREE.Vector3(
      (Math.random()-0.5)*8, // Разлет в стороны
      Math.random()*8,       // Вверх
      (Math.random()-0.5)*8
    ));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color:0xffaa00, size:0.08, transparent:true, opacity:1, depthWrite:false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  let life = 0;
  const tick = () => {
    life += 0.016;
    const a = geo.attributes.position.array;
    for (let i=0; i<N; i++) {
      vel[i].y -= 15*0.016; // Гравитация для частиц
      a[i*3]   += vel[i].x*0.016;
      a[i*3+1] += vel[i].y*0.016;
      a[i*3+2] += vel[i].z*0.016;
    }
    geo.attributes.position.needsUpdate = true;
    mat.opacity = Math.max(0, 1 - life*1.5);
    if (life < 1.0) requestAnimationFrame(tick);
    else { scene.remove(pts); geo.dispose(); mat.dispose(); }
  };
  tick();
}

function playImpactSound() {
  if (!audioCtx) return;
  const ctx = audioCtx, now = ctx.currentTime;

  // Тяжелый удар
  const o1 = ctx.createOscillator(), g1 = ctx.createGain();
  o1.frequency.setValueAtTime(100, now);
  o1.frequency.exponentialRampToValueAtTime(20, now+0.3);
  g1.gain.setValueAtTime(0.8, now);
  g1.gain.exponentialRampToValueAtTime(0.001, now+0.4);
  o1.connect(g1).connect(ctx.destination);
  o1.start(now); o1.stop(now+0.5);

  // Лязг металла
  const o2 = ctx.createOscillator(), g2 = ctx.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(800, now);
  o2.frequency.exponentialRampToValueAtTime(200, now+0.2);
  g2.gain.setValueAtTime(0.2, now);
  g2.gain.exponentialRampToValueAtTime(0.001, now+0.3);
  o2.connect(g2).connect(ctx.destination);
  o2.start(now); o2.stop(now+0.4);
}

// ---------- Цикл анимации ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (wall1 && wall2) {
    // Изменяем прогресс (от 0 до 1)
    if (isCrushing) {
      progress = Math.min(progress + dt * SPEED, 1);
    } else {
      progress = Math.max(progress - dt * SPEED, 0);
    }

    // Плавное движение (можно заменить на progress для резкого движения)
    // Здесь используется Math.pow для эффекта "нарастания давления"
    const easedProgress = 1 - Math.pow(1 - progress, 3); 

    // Двигаем строго по X
    wall1.position.x = THREE.MathUtils.lerp(startX1, targetX1, easedProgress);
    wall2.position.x = THREE.MathUtils.lerp(startX2, targetX2, easedProgress);

    // Проверка на столкновение (когда прогресс дошел до 1)
    if (progress >= 0.99 && isCrushing && !hasCollided) {
      hasCollided = true;
      onImpact();
    }
  }

  // Тряска камеры
  if (shakeAmt > 0) {
    shakeAmt = Math.max(0, shakeAmt - dt * 1.5);
    camera.position.x += (Math.random() - 0.5) * shakeAmt;
    camera.position.y += (Math.random() - 0.5) * shakeAmt;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
