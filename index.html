<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Гидравлический пресс с шипами</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 18px;
            pointer-events: none;
        }
        #crush-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4757;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            z-index: 10;
            outline: none;
            transition: transform 0.1s, background-color 0.2s;
        }
        #crush-btn:active {
            transform: translateX(-50%) scale(0.95);
            background-color: #ff6b81;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">Загрузка модели...</div>
    <div id="canvas-container"></div>
    <button id="crush-btn">Давить</button>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        let wall1 = null;
        let wall2 = null;

        let isCrushing = false;
        let progress = 0;
        
        // Стартовые и конечные точки для реалистичного сближения
        const startX1 = -2.5; 
        const startX2 = 2.5;  
        const targetX1 = -0.55; // Точка смыкания шипов
        const targetX2 = 0.55;  

        const loader = new THREE.GLTFLoader();
        loader.load(
            'model.glb',
            (gltf) => {
                wall1 = gltf.scene;
                
                // Левая стена: шипы смотрят вправо (к центру)
                wall1.position.set(startX1, 0, 0);
                wall1.rotation.y = 0; 
                scene.add(wall1);

                // Правая стена: клонируем и разворачиваем на 180 градусов (шипы смотрят влево, к центру)
                wall2 = wall1.clone();
                wall2.position.set(startX2, 0, 0);
                wall2.rotation.y = Math.PI; // Разворот лицом к первой стене
                scene.add(wall2);

                document.getElementById('loading').style.display = 'none';
            },
            (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading').innerText = `Загрузка: ${percent}%`;
                }
            },
            (error) => {
                console.error('Ошибка:', error);
                document.getElementById('loading').innerText = 'Ошибка загрузки model.glb!';
            }
        );

        const btn = document.getElementById('crush-btn');
        btn.addEventListener('click', () => {
            isCrushing = !isCrushing;
            btn.innerText = isCrushing ? 'Раздвинуть' : 'Давить';
        });

        // Функция физического замедления (эффект тяжести пресса)
        function easeOutBack(x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (wall1 && wall2) {
                if (isCrushing) {
                    if (progress < 1) progress += 0.015; // Плавный тяжелый ход
                } else {
                    if (progress > 0) progress -= 0.02;
                }

                // Применяем физическую функцию движения с легким упором
                const easedProgress = Math.min(Math.max(progress, 0), 1);
                
                wall1.position.x = THREE.MathUtils.lerp(startX1, targetX1, easedProgress);
                wall2.position.x = THREE.MathUtils.lerp(startX2, targetX2, easedProgress);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
