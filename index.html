<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Гидравлический пресс: Реалистичная физика</title>
<style>
  body { margin:0; overflow:hidden; background:#141414; font-family:sans-serif; touch-action:none; user-select:none; }
  #canvas-container { width:100vw; height:100vh; display:block; }
  #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:18px; text-align:center; }
  
  #ui-top {
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:10; width:90%; justify-content:center; flex-wrap:wrap;
  }
  .spawn-btn {
    padding:12px 20px; font-size:16px; font-weight:bold; color:#fff;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3);
    border-radius:20px; backdrop-filter:blur(5px); cursor:pointer;
  }
  .spawn-btn:active { background:rgba(255,255,255,0.3); }

  #crush-btn {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    padding:15px 40px; font-size:20px; font-weight:bold; color:#fff;
    background:#ff4757; border:none; border-radius:30px;
    box-shadow:0 4px 15px rgba(255,71,87,.4); cursor:pointer; z-index:10;
  }
  #crush-btn:active { transform:translateX(-50%) scale(0.95); background:#ff6b81; }
  #crush-btn:disabled { background:#444; box-shadow:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="loading">Загрузка модели...</div>
<div id="canvas-container"></div>

<div id="ui-top">
  <button class="spawn-btn" id="btn-balloon">🎈 Шарик</button>
  <button class="spawn-btn" id="btn-cooler">🥤 Кулер</button>
</div>

<button id="crush-btn" disabled>Давить</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import * as CANNON from 'cannon-es';

// ---------- Рендерер и Сцена ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Ограничиваем pixel ratio для мобилок
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141414);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---------- Постобработка (Bloom для искр) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85);
composer.addPass(bloomPass);

// ---------- Свет ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.0));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
scene.add(dirLight);

// ---------- Физический мир ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
world.allowSleep = true;

const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
groundBody.position.y = -1.5;
world.addBody(groundBody);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color:0x222222, roughness:0.9 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.5;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Переменные пресса ----------
let wallLeft=null, wallRight=null;
let isCrushing = false;
let audioCtx = null;
let shakeAmt = 0;
let progress = 0; 
const SPEED = 4.5; // Скорость движения пресса

let startX1 = 0, startX2 = 0, targetX1 = 0, targetX2 = 0;
const props = [];

// ---------- Загрузка пресса ----------
new GLTFLoader().load('./model.glb', (gltf) => {
  const src = gltf.scene;
  const box = new THREE.Box3().setFromObject(src);
  const center = new THREE.Vector3(); box.getCenter(center);
  src.position.sub(center); 

  src.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material) o.material.side = THREE.DoubleSide; } });

  wallLeft = new THREE.Group(); wallLeft.add(src); wallLeft.rotation.y = -Math.PI / 2; scene.add(wallLeft);
  const clone = src.clone(true); clone.traverse(o => { if (o.isMesh && o.material) o.material = o.material.clone(); });
  wallRight = new THREE.Group(); wallRight.add(clone); wallRight.rotation.y = Math.PI / 2; scene.add(wallRight);

  const rotatedBox = new THREE.Box3().setFromObject(wallLeft);
  const size = new THREE.Vector3(); rotatedBox.getSize(size);
  const halfWidth = size.x / 2;
  
  targetX1 = -halfWidth - 0.01; targetX2 = halfWidth + 0.01;
  startX1 = -halfWidth - 3.5; startX2 = halfWidth + 3.5;

  wallLeft.position.set(startX1, 0, 0); wallRight.position.set(startX2, 0, 0);

  const camDist = Math.max(size.y * 1.8, size.x * 4, 8);
  camera.position.set(0, 1, camDist); controls.target.set(0, 0, 0);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('crush-btn').disabled = false;
});

// ---------- Логика кнопки Давить ----------
document.getElementById('crush-btn').addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  isCrushing = !isCrushing;
  document.getElementById('crush-btn').innerText = isCrushing ? 'Раздвинуть' : 'Давить';
});

// ---------- СПАВН ПРЕДМЕТОВ ----------
document.getElementById('btn-balloon').onclick = () => spawnProp('balloon');
document.getElementById('btn-cooler').onclick = () => spawnProp('cooler');

function spawnProp(type) {
  const startPos = new CANNON.Vec3(0, 4, 0);
  
  if (type === 'balloon') {
    // --- Визуал шарика с шейдером деформации ---
    const geo = new THREE.SphereGeometry(0.4, 32, 32);
    // Создаем кастомный материал на основе MeshPhysicalMaterial
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xff0000, roughness: 0.1, metalness: 0.0,
      clearcoat: 1.0, clearcoatRoughness: 0.1,
      transmission: 0.1, thickness: 0.5,
      // Включаем шейдер деформации
      onBeforeCompile: (shader) => {
        shader.uniforms.uSquash = { value: 0.0 }; // 0 - норма, 1 - полностью сплющен
        shader.vertexShader = `
          uniform float uSquash;
          ${shader.vertexShader}
        `.replace(
          '#include <begin_vertex>',
          `
          #include <begin_vertex>
          // Деформация: сжимаем по X и Y, растягиваем по Z (чтобы сохранить объем)
          float squash = 1.0 - uSquash * 0.8;
          transformed.x *= squash;
          transformed.y *= squash;
          transformed.z *= 1.0 + uSquash * 0.5;
          `
        );
        mat.userData.shader = shader;
      }
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    scene.add(mesh);

    // --- Физика шарика ---
    const shape = new CANNON.Sphere(0.4);
    const body = new CANNON.Body({ mass: 0.1, shape });
    body.position.copy(startPos);
    body.angularVelocity.set(Math.random(), Math.random(), Math.random());
    world.addBody(body);

    props.push({ mesh, body, type, radius: 0.4 });

  } else if (type === 'cooler') {
    // --- Визуал кулера ---
    const group = new THREE.Group();
    // Вода (используем шейдер для эффекта жидкости)
    const waterGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.0, 16);
    const waterMat = new THREE.MeshPhysicalMaterial({ 
      color: 0x00aaff, transmission: 0.8, transparent: true, opacity: 0.8, roughness: 0.1 
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    group.add(waterMesh);
    
    // Пластик
    const plasticGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16);
    const plasticMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.1 });
    const plasticMesh = new THREE.Mesh(plasticGeo, plasticMat);
    plasticMesh.castShadow = true;
    group.add(plasticMesh);
    
    scene.add(group);

    // --- Физика кулера ---
    const shape = new CANNON.Cylinder(0.4, 0.4, 1.2, 16);
    const body = new CANNON.Body({ mass: 2.0, shape });
    body.position.copy(startPos);
    world.addBody(body);

    props.push({ mesh: group, body, type, radius: 0.4 });
  }
}

// ---------- ЭФФЕКТЫ РАЗРУШЕНИЯ ----------
function destroyProp(prop) {
  world.removeBody(prop.body);
  scene.remove(prop.mesh);
  const index = props.indexOf(prop);
  if (index > -1) props.splice(index, 1);

  shakeAmt = 0.8;

  // Создаем частицы (брызги/осколки)
  createExplosion(prop.body.position, prop.type === 'balloon' ? 0xff3333 : 0x00aaff, 150, 20);
  
  if (prop.type === 'cooler') {
    // Для кулера добавляем осколки пластика
    createExplosion(prop.body.position, 0xeeeeee, 80, 15);
    playSound('splash');
  } else {
    playSound('pop');
  }
}

function createExplosion(pos, color, count, speed) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const velocities = [];

  for (let i = 0; i < count; i++) {
    positions[i*3] = pos.x;
    positions[i*3+1] = pos.y;
    positions[i*3+2] = pos.z;
    velocities.push(new THREE.Vector3(
      (Math.random()-0.5) * speed,
      (Math.random()-0.5) * speed + 5,
      (Math.random()-0.5) * speed
    ));
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ 
    color: color, size: 0.08, transparent: true, opacity: 1, depthWrite: false 
  });
  
  const particles = new THREE.Points(geo, mat);
  scene.add(particles);

  let life = 0;
  const tick = () => {
    life += 0.016;
    const array = geo.attributes.position.array;
    for (let i = 0; i < count; i++) {
      velocities[i].y -= 30 * 0.016;
      array[i*3] += velocities[i].x * 0.016;
      array[i*3+1] += velocities[i].y * 0.016;
      array[i*3+2] += velocities[i].z * 0.016;
    }
    geo.attributes.position.needsUpdate = true;
    mat.opacity = Math.max(0, 1 - life * 1.2);
    if (life < 1.5) requestAnimationFrame(tick);
    else { scene.remove(particles); geo.dispose(); mat.dispose(); }
  };
  tick();
}

function playSound(type) {
  if (!audioCtx) return;
  const ctx = audioCtx, now = ctx.currentTime;

  if (type === 'pop') {
    // Более реалистичный звук лопнувшего шара
    const bufferSize = ctx.sampleRate * 0.1;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = ctx.createBufferSource(); noise.buffer = buffer;
    const filter = ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1000;
    const gain = ctx.createGain(); gain.gain.setValueAtTime(1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    
    noise.connect(filter).connect(gain).connect(ctx.destination); noise.start();
    
    const osc = ctx.createOscillator(); const oscGain = ctx.createGain();
    osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
    oscGain.gain.setValueAtTime(1, now); oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.connect(oscGain).connect(ctx.destination); osc.start(); osc.stop(now + 0.2);
  } 
  else if (type === 'splash') {
    // Звук разбившегося кулера
    const bufferSize = ctx.sampleRate * 0.6;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = ctx.createBufferSource(); noise.buffer = buffer;
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800;
    const gain = ctx.createGain(); gain.gain.setValueAtTime(1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    
    noise.connect(filter).connect(gain).connect(ctx.destination); noise.start();
  }
}

// ---------- Анимация и Физика ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 1. Движение пресса (привязано к dt)
  if (wallLeft && wallRight) {
    if (isCrushing) progress = Math.min(progress + dt * SPEED, 1);
    else progress = Math.max(progress - dt * SPEED, 0);

    wallLeft.position.x = THREE.MathUtils.lerp(startX1, targetX1, progress);
    wallRight.position.x = THREE.MathUtils.lerp(startX2, targetX2, progress);
  }

  // 2. Обновление физики
  world.step(1/60, dt, 3);
  
  // 3. Синхронизация и проверка на сжатие
  for (let i = props.length - 1; i >= 0; i--) {
    const p = props[i];
    p.mesh.position.copy(p.body.position);
    p.mesh.quaternion.copy(p.body.quaternion);

    // Проверка на сдавливание
    if (isCrushing && progress > 0.1) {
      const gap = wallRight.position.x - wallLeft.position.x;
      
      // Для шарика: визуальная деформация
      if (p.type === 'balloon' && p.mesh.material.userData.shader) {
        // Вычисляем, насколько сильно сжат шарик
        const squashFactor = THREE.MathUtils.clamp(1 - (gap - p.radius * 2) / 0.5, 0, 1);
        p.mesh.material.userData.shader.uniforms.uSquash.value = squashFactor;
      }

      // Условие разрушения (когда стены слишком близко)
      if (gap <= (p.radius * 2) && Math.abs(p.body.position.x) < p.radius) {
        destroyProp(p);
      }
    }
  }

  // 4. Тряска камеры
  if (shakeAmt > 0) {
    shakeAmt = Math.max(0, shakeAmt - dt * 2.0);
    camera.position.x += (Math.random() - 0.5) * shakeAmt;
    camera.position.y += (Math.random() - 0.5) * shakeAmt;
  }

  controls.update();
  composer.render(); // Используем composer для рендера с постобработкой
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
