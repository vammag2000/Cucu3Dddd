<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer & Logic</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            touch-action: none; /* Запрещаем стандартный скролл страницы на смартфоне */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 18px;
            pointer-events: none;
        }
    </style>
    <!-- Подключаем Three.js и GLTFLoader через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">Загрузка модели...</div>
    <div id="canvas-container"></div>

    <script>
        // 1. Создание сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Оптимизация под мобильные экраны
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // 3. Управление камерой (вращение/зум пальцами)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 4. Переменная для нашей модели
        let myModel = null;
        let mixer = null; // Для анимаций (если есть)

        // 5. Загрузка GLB модели
        const loader = new THREE.GLTFLoader();
        
        // Укажи здесь имя своего .glb файла (он должен лежать в той же папке)
        const MODEL_PATH = 'model.glb'; 

        loader.load(
            MODEL_PATH,
            (gltf) => {
                myModel = gltf.scene;
                scene.add(myModel);

                // Если у модели есть встроенные анимации:
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(myModel);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }

                // Скрываем надпись загрузки
                document.getElementById('loading').style.display = 'none';
            },
            (xhr) => {
                // Прогресс загрузки
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading').innerText = `Загрузка: ${percent}%`;
                }
            },
            (error) => {
                console.error('Ошибка загрузки модели:', error);
                document.getElementById('loading').innerText = 'Ошибка загрузки .glb файла!';
            }
        );

        // 6. Главный цикл анимации
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Если есть анимация скелета/меша — обновляем
            if (mixer) mixer.update(delta);

            // ==========================================
            // ЗДЕСЬ МЫ БУДЕМ ДОБАВЛЯТЬ ТВОЮ ЛОГИКУ ДВИЖЕНИЯ
            // ==========================================
            /* Например, плавное вращение (закомментировано):
            if (myModel) {
                myModel.rotation.y += 0.01;
            }
            */

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 7. Обработка изменения размера экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
