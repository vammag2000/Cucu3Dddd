<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Гидравлический пресс: Кастомная модель</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a0a; font-family:sans-serif; touch-action:none; user-select:none; }
        #canvas-container { width:100vw; height:100vh; display:block; }
        
        #ui-top {
            position:absolute; top:20px; left:50%; transform:translateX(-50%);
            display:flex; gap:10px; z-index:10; width:95%; justify-content:center; flex-wrap:wrap;
        }
        .spawn-btn {
            padding:12px 20px; font-size:16px; font-weight:bold; color:#fff;
            background:rgba(30,30,30,0.85); border:1px solid #555;
            border-radius:12px; backdrop-filter:blur(5px); cursor:pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }
        .spawn-btn:active { transform: scale(0.95); background:#444; }

        #crush-btn {
            position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
            padding:16px 50px; font-size:22px; font-weight:bold; color:#fff;
            background:linear-gradient(135deg, #ff4757, #c0392b); border:none; border-radius:35px;
            box-shadow:0 6px 20px rgba(255,71,87,0.5); cursor:pointer; z-index:10;
            transition: transform 0.1s;
        }
        #crush-btn:active { transform:translateX(-50%) scale(0.95); }
        #crush-btn:disabled { background:#333; box-shadow:none; color:#777; }
        
        #fps { position:absolute; top:80px; right:20px; color:#0f0; font-family:monospace; font-size:14px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:5px; z-index:20; }
        #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:18px; z-index:100; }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm"
        }
    }
    </script>
</head>
<body>
    <div id="loading">Загрузка...</div>
    <div id="canvas-container"></div>
    <div id="fps">FPS: --</div>

    <div id="ui-top">
        <button class="spawn-btn" id="btn-balloon">🎈 Шарик</button>
        <button class="spawn-btn" id="btn-cooler">🥤 Кулер</button>
        <button class="spawn-btn" id="btn-custom">🧊 life.glb</button>
    </div>

    <button id="crush-btn" disabled>ДАВИТЬ</button>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import * as CANNON from 'cannon-es';

        // --- 1. АУДИО СИСТЕМА ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playPopSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 800;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            noise.connect(filter).connect(gain).connect(audioCtx.destination); noise.start(t);

            const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
            oscGain.gain.setValueAtTime(1, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.connect(oscGain).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.2);
        }

        function playSmashSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const bufSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.8, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
            noise.connect(filter).connect(gain).connect(audioCtx.destination); noise.start(t);
            
            const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(80, t); osc.frequency.exponentialRampToValueAtTime(20, t + 0.2);
            oscGain.gain.setValueAtTime(1, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            osc.connect(oscGain).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
        }

        // Звук хруста для кастомной модели
        function playCrunchSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const bufSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1500;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            noise.connect(filter).connect(gain).connect(audioCtx.destination); noise.start(t);

            const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, t); osc.frequency.exponentialRampToValueAtTime(30, t + 0.2);
            oscGain.gain.setValueAtTime(0.8, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.connect(oscGain).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.2);
        }

        function playMetalClankSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            [800, 1200, 1500].forEach((freq, i) => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.15 - i * 0.03, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                osc.connect(gain).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.4);
            });
        }

        // --- 2. Рендерер и Сцена ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap; 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141414);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 3. Свет ---
        scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.bias = -0.001;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        // --- 4. Физический мир ---
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
        world.allowSleep = true; 
        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
        groundBody.position.y = -1.5;
        world.addBody(groundBody);

        const groundMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9, metalness: 0.1 })
        );
        groundMesh.rotation.x = -Math.PI/2;
        groundMesh.position.y = -1.5;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // --- 5. Переменные ---
        let wallLeft, wallRight;
        let isCrushing = false;
        let progress = 0;
        const SPEED = 6.0; 
        let startX1, startX2, targetX1, targetX2;
        const props = []; 
        const clock = new THREE.Clock();
        let hasClanked = false; 

        // --- 6. Загрузка пресса ---
        new GLTFLoader().load('./model.glb', (gltf) => {
            const src = gltf.scene;
            const box = new THREE.Box3().setFromObject(src);
            const center = new THREE.Vector3(); box.getCenter(center);
            src.position.sub(center);

            src.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

            wallLeft = new THREE.Group(); wallLeft.add(src); wallLeft.rotation.y = -Math.PI / 2; scene.add(wallLeft);
            const clone = src.clone(true); 
            clone.traverse(o => { if (o.isMesh && o.material) o.material = o.material.clone(); });
            wallRight = new THREE.Group(); wallRight.add(clone); wallRight.rotation.y = Math.PI / 2; scene.add(wallRight);

            const rotatedBox = new THREE.Box3().setFromObject(wallLeft);
            const size = new THREE.Vector3(); rotatedBox.getSize(size);
            const halfWidth = size.x / 2;

            targetX1 = -halfWidth - 0.05; targetX2 = halfWidth + 0.05;
            startX1 = -halfWidth - 3.5; startX2 = halfWidth + 3.5;

            wallLeft.position.set(startX1, 0, 0); wallRight.position.set(startX2, 0, 0);

            const camDist = Math.max(size.y * 1.8, size.x * 4, 8);
            camera.position.set(0, 1, camDist); controls.target.set(0, 0, 0);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('crush-btn').disabled = false;
        });

        // --- 7. Кнопки ---
        document.getElementById('crush-btn').addEventListener('click', () => {
            initAudio();
            isCrushing = !isCrushing;
            hasClanked = false;
            document.getElementById('crush-btn').innerText = isCrushing ? 'РАЗДВИНУТЬ' : 'ДАВИТЬ';
        });

        document.getElementById('btn-balloon').onclick = () => { initAudio(); spawnBalloon(); };
        document.getElementById('btn-cooler').onclick = () => { initAudio(); spawnCooler(); };
        document.getElementById('btn-custom').onclick = () => { initAudio(); spawnCustomModel(); };

        // --- 8. Спавн ---
        function spawnBalloon() {
            const geo = new THREE.SphereGeometry(0.6, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff2222, roughness: 0.1, metalness: 0.2 });
            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uSquash = { value: 0.0 }; 
                shader.vertexShader = `uniform float uSquash;\n${shader.vertexShader}`.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                    float squash = 1.0 - uSquash * 0.8;
                    float stretch = 1.0 + uSquash * 0.4;
                    transformed.x *= squash; transformed.y *= stretch; transformed.z *= stretch;`
                );
                mat.userData.shader = shader;
            };
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
            const body = new CANNON.Body({ mass: 0.1, shape: new CANNON.Sphere(0.6) });
            body.position.set(0, 4, 0);
            body.angularVelocity.set(Math.random(), Math.random(), Math.random());
            world.addBody(body);
            props.push({ mesh, body, type: 'balloon', radius: 0.6 });
        }

        function spawnCooler() {
            const group = new THREE.Group();
            group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.4, 16), new THREE.MeshStandardMaterial({ color: 0x00aaff, transparent: true, opacity: 0.8, roughness: 0.1 })));
            const plasticMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4, metalness: 0.1 }));
            plasticMesh.castShadow = true; group.add(plasticMesh);
            scene.add(group);
            const body = new CANNON.Body({ mass: 2.0, shape: new CANNON.Cylinder(0.5, 0.5, 1.5, 16) });
            body.position.set(0, 4, 0);
            world.addBody(body);
            props.push({ mesh: group, body, type: 'cooler', radius: 0.5 });
        }

        // ФУНКЦИЯ ЗАГРУЗКИ ВАШЕЙ МОДЕЛИ
        function spawnCustomModel() {
            const loader = new GLTFLoader();
            // Загружаем life.glb (убедитесь, что файл лежит в одной папке с index.html)
            loader.load('./life.glb', (gltf) => {
                const model = gltf.scene;

                // 1. Вычисляем размеры и центрируем
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3(); box.getSize(size);
                const center = new THREE.Vector3(); box.getCenter(center);
                model.position.sub(center);

                // 2. Автомасштабирование (если модель огромная, уменьшаем до размера пресса)
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 1.5) {
                    const scale = 1.5 / maxDim;
                    model.scale.set(scale, scale, scale);
                    size.multiplyScalar(scale); // Обновляем размер для физики
                }

                model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

                // Оборачиваем в Group для удобного сжатия
                const group = new THREE.Group();
                group.add(model);
                scene.add(group);

                // 3. Создаем физическую коробку по размеру модели
                const shape = new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2));
                const body = new CANNON.Body({ mass: 1.5, shape });
                body.position.set(0, 4, 0);
                world.addBody(body);

                props.push({ 
                    mesh: group, 
                    body, 
                    type: 'custom', 
                    radius: Math.max(size.x, size.z) / 2,
                    originalSize: size.clone()
                });

            }, undefined, (err) => {
                console.error(err);
                alert("Ошибка: Не удалось загрузить life.glb!\n\n1. Проверьте, что файл называется life.glb (не .gbl)\n2. Он лежит в той же папке, что и index.html");
            });
        }

        // --- 9. Разрушение ---
        function breakObject(prop) {
            const pos = prop.body.position;
            scene.remove(prop.mesh);
            world.removeBody(prop.body);
            const idx = props.indexOf(prop);
            if (idx > -1) props.splice(idx, 1);

            shakeCamera(prop.type === 'cooler' ? 0.4 : 0.2);

            if (prop.type === 'balloon') playPopSound();
            else if (prop.type === 'cooler') playSmashSound();
            else if (prop.type === 'custom') playCrunchSound(); // Звук для кастомной модели

            const numFragments = prop.type === 'cooler' ? 25 : 15;
            const color = prop.type === 'cooler' ? 0xeeeeee : (prop.type === 'custom' ? 0xcccccc : 0xff2222);
            
            for (let i = 0; i < numFragments; i++) {
                const size = Math.random() * 0.15 + 0.05;
                const fragMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(size, size, size),
                    new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 })
                );
                fragMesh.castShadow = true;
                scene.add(fragMesh);

                const fragBody = new CANNON.Body({ mass: 0.05, shape: new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2)) });
                fragBody.position.set(pos.x + (Math.random()-0.5)*0.5, pos.y + (Math.random()-0.5)*0.5, pos.z + (Math.random()-0.5)*0.5);
                fragBody.velocity.set((Math.random()-0.5)*15, Math.random()*10 + 5, (Math.random()-0.5)*15);
                fragBody.angularVelocity.set(Math.random()*20, Math.random()*20, Math.random()*20);
                world.addBody(fragBody);

                props.push({ mesh: fragMesh, body: fragBody, type: 'fragment', life: 3.0 });
            }
            createSplash(pos, prop.type === 'cooler' ? 0x00aaff : (prop.type === 'custom' ? 0xaaaaaa : 0xffffff));
        }

        function createSplash(pos, color) {
            const count = 50;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            for(let i=0; i<count; i++) {
                positions[i*3] = pos.x; positions[i*3+1] = pos.y; positions[i*3+2] = pos.z;
                velocities.push(new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10, (Math.random()-0.5)*10));
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: color, size: 0.1, transparent: true, opacity: 1, depthWrite: false });
            const particles = new THREE.Points(geo, mat);
            scene.add(particles);
            
            let life = 0;
            const tick = () => {
                life += 0.02;
                const arr = geo.attributes.position.array;
                for(let i=0; i<count; i++) {
                    velocities[i].y -= 20 * 0.02;
                    arr[i*3] += velocities[i].x * 0.02;
                    arr[i*3+1] += velocities[i].y * 0.02;
                    arr[i*3+2] += velocities[i].z * 0.02;
                }
                geo.attributes.position.needsUpdate = true;
                mat.opacity = 1 - life;
                if(life < 1) requestAnimationFrame(tick);
                else { scene.remove(particles); geo.dispose(); mat.dispose(); }
            };
            tick();
        }

        let shakeTime = 0;
        let shakePower = 0;
        function shakeCamera(power) { shakePower = power; shakeTime = 0.2; }

        // --- 10. Цикл ---
        let frames = 0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            frames++;
            const now = performance.now();
            if (now - lastTime > 1000) {
                document.getElementById('fps').innerText = `FPS: ${frames}`;
                frames = 0; lastTime = now;
            }

            if (wallLeft && wallRight) {
                if (isCrushing) progress = Math.min(progress + dt * SPEED, 1);
                else progress = Math.max(progress - dt * SPEED, 0);

                wallLeft.position.x = THREE.MathUtils.lerp(startX1, targetX1, progress);
                wallRight.position.x = THREE.MathUtils.lerp(startX2, targetX2, progress);
                
                if (progress >= 0.99 && isCrushing && !hasClanked) {
                    hasClanked = true;
                    playMetalClankSound();
                    shakeCamera(0.3);
                }

                const currentGap = wallRight.position.x - wallLeft.position.x;
                const centerGap = currentGap - (targetX2 - targetX1); 

                for (let i = props.length - 1; i >= 0; i--) {
                    const p = props[i];
                    
                    if (p.type === 'balloon') {
                        if (Math.abs(p.body.position.x) < 1.0 && p.body.position.y > -1.5) {
                            const squashFactor = THREE.MathUtils.clamp(1 - (centerGap / (p.radius * 2)), 0, 1);
                            if (p.mesh.material.userData.shader) p.mesh.material.userData.shader.uniforms.uSquash.value = squashFactor;
                            if (squashFactor > 0.95) breakObject(p);
                        }
                    }

                    if (p.type === 'cooler') {
                        if (currentGap < 1.2 && Math.abs(p.body.position.x) < p.radius) breakObject(p);
                    }

                    // СЖАТИЕ КАСТОМНОЙ МОДЕЛИ
                    if (p.type === 'custom') {
                        if (Math.abs(p.body.position.x) < 1.5 && p.body.position.y > -1.5) {
                            const squashFactor = THREE.MathUtils.clamp(1 - (centerGap / p.originalSize.x), 0, 1);
                            
                            // Визуально сплющиваем модель (сжимаем по X, растягиваем по Y и Z)
                            p.mesh.scale.x = Math.max(0.1, 1 - squashFactor * 0.8);
                            p.mesh.scale.y = 1 + squashFactor * 0.3;
                            p.mesh.scale.z = 1 + squashFactor * 0.3;

                            // Если сжали до предела - ломаем
                            if (squashFactor > 0.9) breakObject(p);
                        }
                    }
                }
            }

            world.step(1/60, dt, 3);

            for (let i = props.length - 1; i >= 0; i--) {
                const p = props[i];
                p.mesh.position.copy(p.body.position);
                p.mesh.quaternion.copy(p.body.quaternion);

                if (p.type === 'fragment') {
                    p.life -= dt;
                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        world.removeBody(p.body);
                        props.splice(i, 1);
                    }
                }
            }

            controls.update(); 
            if (shakeTime > 0) {
                shakeTime -= dt;
                camera.position.x += (Math.random() - 0.5) * shakePower;
                camera.position.y += (Math.random() - 0.5) * shakePower;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
