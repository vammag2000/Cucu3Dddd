<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Гидравлический пресс</title>
<style>
  body { margin:0; overflow:hidden; background:#141414; font-family:sans-serif; touch-action:none; }
  #canvas-container { width:100vw; height:100vh; display:block; }
  #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             color:#fff; font-size:18px; text-align:center; padding:0 20px; }
  #crush-btn {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    padding:15px 40px; font-size:20px; font-weight:bold; color:#fff;
    background:#ff4757; border:none; border-radius:30px;
    box-shadow:0 4px 15px rgba(255,71,87,.4); cursor:pointer; z-index:10;
  }
  #crush-btn:active { transform:translateX(-50%) scale(0.95); background:#ff6b81; }
  #crush-btn:disabled { background:#444; box-shadow:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">Загрузка модели...</div>
<div id="canvas-container"></div>
<button id="crush-btn" disabled>Давить</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Рендерер ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ---------- Сцена ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141414);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- Камера ----------
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ---------- Свет ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.0));

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.bias = -0.0005;
scene.add(dirLight);

// ---------- Состояние ----------
let topWall=null, bottomWall=null;
let isCrushing = false, hasCollided = false;
let audioCtx = null;
let shakeAmt = 0;

let progress = 0; 
const SPEED = 4.0; // ОЧЕНЬ БЫСТРО (1.0 = 1 секунда, 4.0 = 0.25 секунды)

let startY = 0;
let contactY = 0;
let boxSize = new THREE.Vector3();

// ---------- Загрузка ----------
new GLTFLoader().load('./model.glb', (gltf) => {
  const src = gltf.scene;

  // 1. Центрируем модель идеально в нуле координат
  const box = new THREE.Box3().setFromObject(src);
  box.getSize(boxSize);
  const center = new THREE.Vector3(); box.getCenter(center);
  src.position.sub(center); // Теперь центр модели ровно на (0,0,0)

  src.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });

  // 2. ВЕРХНЯЯ СТЕНА (Шипы вниз)
  topWall = new THREE.Group();
  topWall.add(src);
  // Поворачиваем на -90 градусов вокруг Z, чтобы шипы (которые смотрят вправо) смотрели ВНИЗ
  topWall.rotation.z = -Math.PI / 2; 
  scene.add(topWall);

  // 3. НИЖНЯЯ СТЕНА (Шипы вверх)
  const clone = src.clone(true);
  clone.traverse(o => { if (o.isMesh && o.material) o.material = o.material.clone(); });
  bottomWall = new THREE.Group();
  bottomWall.add(clone);
  // Поворачиваем на +90 градусов вокруг Z, чтобы шипы смотрели ВВЕРХ
  bottomWall.rotation.z = Math.PI / 2; 
  scene.add(bottomWall);

  // 4. Вычисляем точку соприкосновения шипов
  // Раз мы повернули модель на 90 градусов, её старая ширина (X) стала высотой (Y).
  // Значит, расстояние от центра до кончика шипов = половина ширины.
  const spikeTipDist = boxSize.x / 2;
  
  // Они должны встретиться в этой точке (верхняя опускается до +dist, нижняя поднимается до -dist)
  contactY = spikeTipDist;
  
  // Стартовая позиция (далеко друг от друга)
  startY = contactY + boxSize.y * 0.4 + 1.5;

  topWall.position.y = startY;
  bottomWall.position.y = -startY;

  // 5. Настройка камеры
  const camDist = Math.max(boxSize.y * 1.5, boxSize.z * 2, 5);
  camera.position.set(0, 0, camDist);
  controls.target.set(0, 0, 0);

  const fit = Math.max(boxSize.x, boxSize.y, boxSize.z) * 2.5;
  const sc = dirLight.shadow.camera;
  sc.left = -fit; sc.right = fit; sc.top = fit; sc.bottom = -fit;
  sc.near = 0.1; sc.far = fit*6; sc.updateProjectionMatrix();
  dirLight.position.set(fit, fit, fit);

  // Включаем кнопку
  document.getElementById('loading').style.display = 'none';
  const btn = document.getElementById('crush-btn');
  btn.disabled = false;

  btn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isCrushing = !isCrushing;
    if (isCrushing) hasCollided = false;
    btn.innerText = isCrushing ? 'Раздвинуть' : 'Давить';
  });
},
(xhr) => {
  if (xhr.total) {
    document.getElementById('loading').innerText = `Загрузка: ${Math.round(xhr.loaded/xhr.total*100)}%`;
  }
},
(err) => {
  console.error(err);
  document.getElementById('loading').innerText = 'Ошибка загрузки model.glb.';
});

// ---------- Эффекты при ударе ----------
function onImpact() {
  shakeAmt = 0.3; // Сильная тряска
  spawnSparks();  // Искры
  playImpactSound(); // Звук
}

function spawnSparks() {
  const N = 100;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const vel = [];
  
  // Искры вылетают ровно из центра столкновения (0,0,0)
  for (let i=0; i<N; i++) {
    pos[i*3]   = (Math.random()-0.5) * boxSize.z; // По ширине стены
    pos[i*3+1] = 0; 
    pos[i*3+2] = (Math.random()-0.5) * 0.5;
    
    // Разлетаются в стороны и немного вверх/вниз
    vel.push(new THREE.Vector3(
      (Math.random()-0.5) * 15, // Сильно в стороны
      (Math.random()-0.5) * 10, // Вверх и вниз
      (Math.random()-0.5) * 5
    ));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color:0xffaa00, size:0.06, transparent:true, opacity:1, depthWrite:false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  let life = 0;
  const tick = () => {
    life += 0.016;
    const a = geo.attributes.position.array;
    for (let i=0; i<N; i++) {
      vel[i].y -= 20*0.016; // Гравитация
      a[i*3]   += vel[i].x*0.016;
      a[i*3+1] += vel[i].y*0.016;
      a[i*3+2] += vel[i].z*0.016;
    }
    geo.attributes.position.needsUpdate = true;
    mat.opacity = Math.max(0, 1 - life*1.5);
    if (life < 0.8) requestAnimationFrame(tick);
    else { scene.remove(pts); geo.dispose(); mat.dispose(); }
  };
  tick();
}

function playImpactSound() {
  if (!audioCtx) return;
  const ctx = audioCtx, now = ctx.currentTime;

  // Глухой мощный удар
  const o1 = ctx.createOscillator(), g1 = ctx.createGain();
  o1.frequency.setValueAtTime(120, now);
  o1.frequency.exponentialRampToValueAtTime(20, now+0.3);
  g1.gain.setValueAtTime(1.0, now);
  g1.gain.exponentialRampToValueAtTime(0.001, now+0.5);
  o1.connect(g1).connect(ctx.destination);
  o1.start(now); o1.stop(now+0.6);

  // Металлический лязг
  const o2 = ctx.createOscillator(), g2 = ctx.createGain();
  o2.type = 'sawtooth';
  o2.frequency.setValueAtTime(900, now);
  o2.frequency.exponentialRampToValueAtTime(150, now+0.15);
  g2.gain.setValueAtTime(0.2, now);
  g2.gain.exponentialRampToValueAtTime(0.001, now+0.3);
  o2.connect(g2).connect(ctx.destination);
  o2.start(now); o2.stop(now+0.4);
}

// ---------- Цикл анимации ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (topWall && bottomWall) {
    // Изменяем прогресс (от 0 до 1)
    if (isCrushing) {
      progress = Math.min(progress + dt * SPEED, 1);
    } else {
      progress = Math.max(progress - dt * SPEED, 0);
    }

    // Двигаем строго по Y (верхняя вниз, нижняя вверх)
    topWall.position.y = THREE.MathUtils.lerp(startY, contactY, progress);
    bottomWall.position.y = THREE.MathUtils.lerp(-startY, -contactY, progress);

    // Проверка на столкновение (когда прогресс дошел до 1)
    if (progress >= 0.99 && isCrushing && !hasCollided) {
      hasCollided = true;
      onImpact();
    }
  }

  // Тряска камеры
  if (shakeAmt > 0) {
    shakeAmt = Math.max(0, shakeAmt - dt * 1.5);
    camera.position.x += (Math.random() - 0.5) * shakeAmt;
    camera.position.y += (Math.random() - 0.5) * shakeAmt;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
