<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Настройка пресса</title>
<style>
  body { margin:0; overflow:hidden; background:#141414; font-family:sans-serif; touch-action:none; color:white; }
  #canvas-container { width:100vw; height:100vh; display:block; }
  
  /* UI Панель */
  #ui {
    position:absolute; bottom:0; left:0; width:100%; background:rgba(20,20,20,0.9);
    border-top:1px solid #333; padding:10px; box-sizing:border-box;
    display:flex; flex-direction:column; gap:8px; z-index:10;
  }
  
  .row { display:flex; gap:5px; justify-content:center; }
  
  button {
    flex:1; padding:12px 5px; font-size:14px; font-weight:bold; color:#fff;
    background:#333; border:1px solid #555; border-radius:8px; cursor:pointer;
    user-select:none;
  }
  button:active { background:#555; }
  
  button.active { background:#ff4757; border-color:#ff4757; }
  button.action { background:#2ed573; border-color:#2ed573; color:#000; }
  
  #crush-btn {
    position:absolute; bottom:280px; left:50%; transform:translateX(-50%);
    padding:15px 40px; font-size:20px; font-weight:bold; color:#fff;
    background:#ff4757; border:none; border-radius:30px; z-index:5;
  }
  
  #output { width:100%; height:60px; background:#000; color:#0f0; border:1px solid #333; padding:5px; font-family:monospace; font-size:12px; box-sizing:border-box; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="canvas-container"></div>

<button id="crush-btn">Тест (Давить)</button>

<div id="ui">
  <div class="row">
    <button id="sel-L" class="active">ЛЕВАЯ СТЕНА</button>
    <button id="sel-R">ПРАВАЯ СТЕНА</button>
  </div>
  
  <div class="row">
    <button onclick="move('x', -0.1)">X -</button>
    <button onclick="move('x', 0.1)">X +</button>
    <button onclick="move('y', -0.1)">Y -</button>
    <button onclick="move('y', 0.1)">Y +</button>
    <button onclick="move('z', -0.1)">Z -</button>
    <button onclick="move('z', 0.1)">Z +</button>
  </div>

  <div class="row">
    <button onclick="rotate('x', -15)">RX -15</button>
    <button onclick="rotate('x', 15)">RX +15</button>
    <button onclick="rotate('y', -15)">RY -15</button>
    <button onclick="rotate('y', 15)">RY +15</button>
    <button onclick="rotate('z', -15)">RZ -15</button>
    <button onclick="rotate('z', 15)">RZ +15</button>
  </div>

  <div class="row">
    <button class="action" onclick="copyCoords()">КОПИРОВАТЬ КООРДИНАТЫ</button>
    <button onclick="resetCoords()">Сброс</button>
  </div>
  
  <textarea id="output" readonly placeholder="Здесь появятся координаты..."></textarea>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- База ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141414);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 2, 10);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);

// Сетка для ориентира
const grid = new THREE.GridHelper(10, 10, 0x555555, 0x333333);
scene.add(grid);

// ---------- Переменные ----------
let wallL, wallR;
let activeWall = 'L'; // Какая стена сейчас выбрана

// Начальные координаты (мы их будем менять кнопками)
const state = {
  L: { px: -2.5, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 },
  R: { px: 2.5, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 }
};

// ---------- Загрузка модели ----------
new GLTFLoader().load('./model.glb', (gltf) => {
  const src = gltf.scene;
  
  // Центруем модель внутри её же группы, чтобы она вращалась вокруг своего центра
  const box = new THREE.Box3().setFromObject(src);
  const center = new THREE.Vector3(); box.getCenter(center);
  src.position.sub(center);

  src.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) o.material.side = THREE.DoubleSide;
    }
  });

  // Создаем левую
  wallL = new THREE.Group();
  wallL.add(src);
  scene.add(wallL);

  // Создаем правую (клонируем)
  const clone = src.clone(true);
  clone.traverse(o => { if (o.isMesh && o.material) o.material = o.material.clone(); });
  wallR = new THREE.Group();
  wallR.add(clone);
  scene.add(wallR);

  applyTransforms(); // Применяем стартовые координаты
},
(xhr) => { /* прогресс бар можно опустить */ },
(err) => { console.error("Ошибка загрузки", err); });

// ---------- Функции управления ----------
window.move = (axis, amount) => {
  if (activeWall === 'L') state.L['p' + axis] += amount;
  else state.R['p' + axis] += amount;
  applyTransforms();
};

window.rotate = (axis, degrees) => {
  const rad = degrees * (Math.PI / 180);
  if (activeWall === 'L') state.L['r' + axis] += rad;
  else state.R['r' + axis] += rad;
  applyTransforms();
};

window.resetCoords = () => {
  state.L = { px: -2.5, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 };
  state.R = { px: 2.5, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 };
  applyTransforms();
};

window.copyCoords = () => {
  const text = `Left: pos(${state.L.px.toFixed(2)}, ${state.L.py.toFixed(2)}, ${state.L.pz.toFixed(2)}) rot(${state.L.rx.toFixed(2)}, ${state.L.ry.toFixed(2)}, ${state.L.rz.toFixed(2)}) \nRight: pos(${state.R.px.toFixed(2)}, ${state.R.py.toFixed(2)}, ${state.R.pz.toFixed(2)}) rot(${state.R.rx.toFixed(2)}, ${state.R.ry.toFixed(2)}, ${state.R.rz.toFixed(2)})`;
  document.getElementById('output').value = text;
  navigator.clipboard.writeText(text).then(() => {
    alert("Скопировано! Вставь сюда в чат.");
  });
};

function applyTransforms() {
  if (!wallL || !wallR) return;
  
  wallL.position.set(state.L.px, state.L.py, state.L.pz);
  wallL.rotation.set(state.L.rx, state.L.ry, state.L.rz);
  
  wallR.position.set(state.R.px, state.R.py, state.R.pz);
  wallR.rotation.set(state.R.rx, state.R.ry, state.R.rz);
}

// Переключение активной стены
document.getElementById('sel-L').onclick = (e) => {
  activeWall = 'L';
  e.target.classList.add('active');
  document.getElementById('sel-R').classList.remove('active');
};
document.getElementById('sel-R').onclick = (e) => {
  activeWall = 'R';
  e.target.classList.add('active');
  document.getElementById('sel-L').classList.remove('active');
};

// ---------- Тестовая анимация (кнопка Давить) ----------
let isCrushing = false;
let progress = 0;
document.getElementById('crush-btn').onclick = () => {
  isCrushing = !isCrushing;
};

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (isCrushing) progress = Math.min(progress + dt * 2, 1);
  else progress = Math.max(progress - dt * 2, 0);

  // Если стены стоят ровно, они просто едут навстречу
  if (wallL && wallR && !isCrushing) {
    applyTransforms(); // Возвращаем туда, куда поставил пользователь
  } else if (wallL && wallR && isCrushing) {
    // Временно едем в центр (0,0,0) для проверки
    const tempLx = state.L.px * (1 - progress);
    const tempRx = state.R.px * (1 - progress);
    wallL.position.x = tempLx;
    wallR.position.x = tempRx;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
