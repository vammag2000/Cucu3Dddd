<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Гидравлический пресс: Куриное бедро</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a0a; font-family:sans-serif; touch-action:none; user-select:none; }
        #canvas-container { width:100vw; height:100vh; display:block; }
        
        #ui-top {
            position:absolute; top:20px; left:50%; transform:translateX(-50%);
            display:flex; gap:10px; z-index:10; width:95%; justify-content:center; flex-wrap:wrap;
        }
        .spawn-btn {
            padding:12px 20px; font-size:16px; font-weight:bold; color:#fff;
            background:rgba(30,30,30,0.85); border:1px solid #555;
            border-radius:12px; backdrop-filter:blur(5px); cursor:pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }
        .spawn-btn:active { transform: scale(0.95); background:#444; }

        #crush-btn {
            position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
            padding:16px 50px; font-size:22px; font-weight:bold; color:#fff;
            background:linear-gradient(135deg, #ff4757, #c0392b); border:none; border-radius:35px;
            box-shadow:0 6px 20px rgba(255,71,87,0.5); cursor:pointer; z-index:10;
            transition: transform 0.1s;
        }
        #crush-btn:active { transform:translateX(-50%) scale(0.95); }
        #crush-btn:disabled { background:#333; box-shadow:none; color:#777; }
        
        #fps { position:absolute; top:80px; right:20px; color:#0f0; font-family:monospace; font-size:14px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:5px; z-index:20; }
        #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:18px; z-index:100; }
        
        #error-msg {
            position:absolute; top:20%; left:50%; transform:translateX(-50%);
            background:rgba(255,0,0,0.8); color:white; padding:15px; border-radius:10px;
            font-size:14px; display:none; z-index:200; text-align:center; width:80%; pointer-events:none;
        }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm"
        }
    }
    </script>
</head>
<body>
    <div id="loading">Загрузка...</div>
    <div id="error-msg">Ошибка загрузки</div>
    <div id="canvas-container"></div>
    <div id="fps">FPS: --</div>

    <div id="ui-top">
        <button class="spawn-btn" id="btn-balloon">🎈 Шарик</button>
        <button class="spawn-btn" id="btn-cooler">🥤 Кулер</button>
        <button class="spawn-btn" id="btn-custom">🍗 Куриное бедро (life)</button>
    </div>

    <button id="crush-btn" disabled>ДАВИТЬ</button>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import * as CANNON from 'cannon-es';

        // --- 1. АУДИО ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSquishSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            // Звук чавканья/сжатия
            const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.3);
            oscGain.gain.setValueAtTime(0.5, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            osc.connect(oscGain).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
        }

        function playCrunchSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const bufSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1000;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            noise.connect(filter).connect(gain).connect(audioCtx.destination); noise.start(t);
        }

        function playPopSound() { /* ... (из прошлого кода) ... */ }
        function playSmashSound() { /* ... (из прошлого кода) ... */ }
        function playMetalClankSound() { /* ... (из прошлого кода) ... */ }

        // --- 2. БАЗА ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap; 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141414);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
        world.allowSleep = true; 
        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
        groundBody.position.y = -1.5;
        world.addBody(groundBody);

        const groundMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9, metalness: 0.1 })
        );
        groundMesh.rotation.x = -Math.PI/2;
        groundMesh.position.y = -1.5;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        let wallLeft, wallRight;
        let isCrushing = false;
        let progress = 0;
        const SPEED = 6.0; 
        let startX1, startX2, targetX1, targetX2;
        const props = []; 
        const clock = new THREE.Clock();
        let hasClanked = false; 
        
        let crushCount = 0; // Счетчик нажатий
        let kostyaModelTemplate = null; // Шаблон для кости

        // Загружаем пресс
        new GLTFLoader().load('./model.glb', (gltf) => {
            const src = gltf.scene;
            const box = new THREE.Box3().setFromObject(src);
            const center = new THREE.Vector3(); box.getCenter(center);
            src.position.sub(center);

            src.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

            wallLeft = new THREE.Group(); wallLeft.add(src); wallLeft.rotation.y = -Math.PI / 2; scene.add(wallLeft);
            const clone = src.clone(true); 
            clone.traverse(o => { if (o.isMesh && o.material) o.material = o.material.clone(); });
            wallRight = new THREE.Group(); wallRight.add(clone); wallRight.rotation.y = Math.PI / 2; scene.add(wallRight);

            const rotatedBox = new THREE.Box3().setFromObject(wallLeft);
            const size = new THREE.Vector3(); rotatedBox.getSize(size);
            const halfWidth = size.x / 2;

            targetX1 = -halfWidth - 0.05; targetX2 = halfWidth + 0.05;
            startX1 = -halfWidth - 3.5; startX2 = halfWidth + 3.5;

            wallLeft.position.set(startX1, 0, 0); wallRight.position.set(startX2, 0, 0);
            camera.position.set(0, 1, Math.max(size.y * 1.8, size.x * 4, 8)); controls.target.set(0, 0, 0);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('crush-btn').disabled = false;
        });

        // Предзагружаем кость (kostya.glb)
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        loader.load('./kostya.glb', (gltf) => {
            kostyaModelTemplate = gltf.scene;
            kostyaModelTemplate.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        }, undefined, () => {
            console.warn("Файл kostya.glb не найден. Кость не появится на 3-м этапе.");
        });

        // --- 3. КНОПКИ ---
        document.getElementById('crush-btn').addEventListener('click', () => {
            initAudio();
            isCrushing = !isCrushing;
            hasClanked = false;
            document.getElementById('crush-btn').innerText = isCrushing ? 'РАЗДВИНУТЬ' : 'ДАВИТЬ';
        });

        document.getElementById('btn-custom').onclick = () => { initAudio(); spawnLife(); };

        // --- 4. СПАВН LIFE ---
        function spawnLife() {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';

            loader.load('./life.glb', (gltf) => {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3(); box.getSize(size);
                const center = new THREE.Vector3(); box.getCenter(center);
                model.position.sub(center);

                // Масштабируем
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 1.2 / maxDim; // Чуть меньше пресса
                    model.scale.set(scale, scale, scale);
                    size.multiplyScalar(scale);
                }

                const group = new THREE.Group();
                group.add(model);
                scene.add(group);

                // ФИЗИКА: Запрещаем вращение, чтобы он падал ровно!
                const shape = new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2));
                const body = new CANNON.Body({ mass: 1.5, shape });
                body.position.set(0, 4, 0);
                body.fixedRotation = true; // НЕ ПАДАЕТ, СТОИТ РОВНО
                body.updateMassProperties();
                world.addBody(body);

                props.push({ 
                    mesh: group, 
                    body, 
                    type: 'life', 
                    radius: Math.max(size.x, size.z) / 2,
                    originalSize: size.clone(),
                    stage: 0 // 0 - целый, 1 - сплющен
                });

            }, undefined, (err) => {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = 'Не удалось загрузить life.glb<br>Проверьте имя и папку';
            });
        }

        // --- 5. ЭФФЕКТЫ (КРОВЬ) ---
        function spawnBloodDrops(pos, count = 30, speed = 10) {
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            for(let i=0; i<count; i++) {
                positions[i*3] = pos.x; positions[i*3+1] = pos.y; positions[i*3+2] = pos.z;
                velocities.push(new THREE.Vector3((Math.random()-0.5)*speed, Math.random()*speed, (Math.random()-0.5)*speed));
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x990000, size: 0.08, transparent: true, opacity: 1 });
            const particles = new THREE.Points(geo, mat);
            scene.add(particles);
            
            let life = 0;
            const tick = () => {
                life += 0.02;
                const arr = geo.attributes.position.array;
                for(let i=0; i<count; i++) {
                    velocities[i].y -= 25 * 0.02;
                    arr[i*3] += velocities[i].x * 0.02;
                    arr[i*3+1] += velocities[i].y * 0.02;
                    arr[i*3+2] += velocities[i].z * 0.02;
                    if (arr[i*3+1] < -1.5) { arr[i*3+1] = -1.5; velocities[i].y = 0; velocities[i].x = 0; velocities[i].z = 0; } // Оседает на полу
                }
                geo.attributes.position.needsUpdate = true;
                mat.opacity = Math.max(0, 1 - life * 0.5);
                if(life < 2) requestAnimationFrame(tick);
                else { scene.remove(particles); geo.dispose(); mat.dispose(); }
            };
            tick();
        }

        function addBloodStain(pos, normal, parent) {
            // Создаем лужу (плоский круг)
            const geo = new THREE.CircleGeometry(Math.random() * 0.4 + 0.2, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0x660000, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide });
            const stain = new THREE.Mesh(geo, mat);
            
            stain.position.copy(pos);
            
            // Ориентируем по нормали поверхности
            if (normal.equals(new THREE.Vector3(0, 1, 0))) {
                stain.rotation.x = -Math.PI / 2;
                stain.position.y += 0.01;
            } else if (normal.equals(new THREE.Vector3(1, 0, 0))) {
                stain.rotation.y = Math.PI / 2;
                stain.position.x += 0.01;
            } else if (normal.equals(new THREE.Vector3(-1, 0, 0))) {
                stain.rotation.y = -Math.PI / 2;
                stain.position.x -= 0.01;
            }

            parent.add(stain);
        }

        // --- 6. ЛОГИКА РАЗРУШЕНИЯ LIFE ---
        function handleLifeCrush(prop) {
            if (prop.stage === 0) {
                // ЭТАП 1: Сжатие и брызги, но остается целым
                prop.stage = 1;
                playSquishSound();
                shakeCamera(0.2);
                
                // Брызги крови
                spawnBloodDrops(prop.body.position, 40, 8);
                
                // Пятна на шипах
                addBloodStain(new THREE.Vector3(wallLeft.position.x + 1.5, 0, 0), new THREE.Vector3(1, 0, 0), scene);
                addBloodStain(new THREE.Vector3(wallRight.position.x - 1.5, 0, 0), new THREE.Vector3(-1, 0, 0), scene);
                
            } else if (prop.stage === 1) {
                // ЭТАП 2: Полный разрыв на куски
                playCrunchSound();
                shakeCamera(0.5);
                
                const pos = prop.body.position;
                
                // Удаляем бедро
                scene.remove(prop.mesh);
                world.removeBody(prop.body);
                const idx = props.indexOf(prop);
                if (idx > -1) props.splice(idx, 1);

                // Много крови
                spawnBloodDrops(pos, 100, 15);
                
                // Лужи на полу
                for(let i=0; i<5; i++) {
                    addBloodStain(new THREE.Vector3((Math.random()-0.5)*2, -1.49, (Math.random()-0.5)*2), new THREE.Vector3(0, 1, 0), scene);
                }

                // Куски мяса
                for (let i = 0; i < 20; i++) {
                    const size = Math.random() * 0.15 + 0.05;
                    const fragMesh = new THREE.Mesh(
                        new THREE.SphereGeometry(size, 8, 8), // Круглые куски
                        new THREE.MeshStandardMaterial({ color: 0xcc1111, roughness: 0.6 })
                    );
                    fragMesh.castShadow = true;
                    scene.add(fragMesh);

                    const fragBody = new CANNON.Body({ mass: 0.1, shape: new CANNON.Sphere(size) });
                    fragBody.position.set(pos.x + (Math.random()-0.5)*0.4, pos.y + (Math.random()-0.5)*0.4, pos.z + (Math.random()-0.5)*0.4);
                    fragBody.velocity.set((Math.random()-0.5)*10, Math.random()*8 + 2, (Math.random()-0.5)*10);
                    world.addBody(fragBody);

                    props.push({ mesh: fragMesh, body: fragBody, type: 'fragment', life: 4.0 });
                }
            }
        }

        // --- 7. ЦИКЛ ---
        let frames = 0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            frames++;
            const now = performance.now();
            if (now - lastTime > 1000) {
                document.getElementById('fps').innerText = `FPS: ${frames}`;
                frames = 0; lastTime = now;
            }

            if (wallLeft && wallRight) {
                if (isCrushing) progress = Math.min(progress + dt * SPEED, 1);
                else progress = Math.max(progress - dt * SPEED, 0);

                wallLeft.position.x = THREE.MathUtils.lerp(startX1, targetX1, progress);
                wallRight.position.x = THREE.MathUtils.lerp(startX2, targetX2, progress);
                
                const currentGap = wallRight.position.x - wallLeft.position.x;
                const centerGap = currentGap - (targetX2 - targetX1); 

                // Проверка сжатия LIFE
                for (let i = props.length - 1; i >= 0; i--) {
                    const p = props[i];
                    
                    if (p.type === 'life') {
                        if (Math.abs(p.body.position.x) < 1.5 && p.body.position.y > -1.5) {
                            // Визуальное сплющивание
                            const squashFactor = THREE.MathUtils.clamp(1 - (centerGap / p.originalSize.x), 0, 1);
                            p.mesh.scale.x = Math.max(0.2, 1 - squashFactor * 0.7); // Сжимаем по X
                            p.mesh.scale.y = 1 + squashFactor * 0.2; // Растягиваем по Y
                            
                            // Если пресс дошел до конца и это первый этап - ломаем
                            if (progress >= 0.99 && isCrushing && !hasClanked) {
                                hasClanked = true;
                                handleLifeCrush(p);
                            }
                        }
                    }

                    // Обычные осколки
                    if (p.type === 'fragment') {
                        p.life -= dt;
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            world.removeBody(p.body);
                            props.splice(i, 1);
                        }
                    }
                }

                // ТРЕТИЙ ЭТАП: Появление кости
                if (progress >= 0.99 && isCrushing && !hasClanked) {
                    hasClanked = true;
                    
                    // Если был 2-й этап (разрыв), спавним кость
                    const lifeExists = props.some(p => p.type === 'life');
                    if (!lifeExists && crushCount === 1) {
                        crushCount++; // Теперь 3-й этап
                        playMetalClankSound();
                        
                        if (kostyaModelTemplate) {
                            // Убираем старое мясо
                            for (let i = props.length - 1; i >= 0; i--) {
                                if (props[i].type === 'fragment') {
                                    scene.remove(props[i].mesh);
                                    world.removeBody(props[i].body);
                                    props.splice(i, 1);
                                }
                            }

                            // Добавляем кость
                            const bone = kostyaModelTemplate.clone();
                            const bBox = new THREE.Box3().setFromObject(bone);
                            const bCenter = new THREE.Vector3(); bBox.getCenter(bCenter);
                            bone.position.sub(bCenter);
                            bone.scale.set(1.2, 1.2, 1.2);

                            const group = new THREE.Group();
                            group.add(bone);
                            scene.add(group);

                            const bShape = new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)); // Примерный размер
                            const bBody = new CANNON.Body({ mass: 1.0, shape: bShape });
                            bBody.position.set(0, 0, 0);
                            bBody.fixedRotation = true;
                            world.addBody(bBody);

                            props.push({ mesh: group, body: bBody, type: 'bone' });
                        }
                    }
                }

                // Звук удара стен
                if (progress >= 0.99 && isCrushing && !hasClanked && !props.some(p => p.type === 'life')) {
                    hasClanked = true;
                    playMetalClankSound();
                }
            }

            world.step(1/60, dt, 3);

            for (let i = props.length - 1; i >= 0; i--) {
                const p = props[i];
                p.mesh.position.copy(p.body.position);
                p.mesh.quaternion.copy(p.body.quaternion);
            }

            controls.update(); 
            if (shakeTime > 0) {
                shakeTime -= dt;
                camera.position.x += (Math.random() - 0.5) * shakePower;
                camera.position.y += (Math.random() - 0.5) * shakePower;
            }

            renderer.render(scene, camera);
        }

        // Вспомогательные функции
        let shakeTime = 0; let shakePower = 0;
        function shakeCamera(power) { shakePower = power; shakeTime = 0.2; }
        function playPopSound() {}
        function playSmashSound() {}

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
