<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест загрузки</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        #status { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .error { color: #ff4757; }
        .success { color: #2ed573; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="status">Начинаю загрузку...</div>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const status = document.getElementById('status');
        const loader = new GLTFLoader();

        // Пытаемся загрузить только пресс
        loader.load('./model.glb', 
            (gltf) => {
                status.innerText = "УСПЕХ! model.glb загружен.";
                status.className = "success";
            },
            (xhr) => {
                status.innerText = `Загрузка: ${xhr.loaded} байт...`;
            },
            (err) => {
                status.innerText = "ОШИБКА: model.glb не найден или заблокирован!";
                status.className = "error";
                console.error(err);
            }
        );
    </script>
</body>
</html>
