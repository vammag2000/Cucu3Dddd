<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Стены с шипами</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 18px;
            pointer-events: none;
        }
        /* Стиль для кнопки «Давить» внизу экрана */
        #crush-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4757;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            z-index: 10;
            outline: none;
            transition: transform 0.1s, background-color 0.2s;
        }
        #crush-btn:active {
            transform: translateX(-50%) scale(0.95);
            background-color: #ff6b81;
        }
    </style>
    <!-- Подключаем Three.js через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">Загрузка модели...</div>
    <div id="canvas-container"></div>
    
    <!-- Кнопка управления -->
    <button id="crush-btn">Давить</button>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // Управление камерой пальцем
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        let wall1 = null;
        let wall2 = null;

        // Переменные для анимации движения стен
        let isCrushing = false;
        let progress = 0; // от 0 (раздвинуты) до 1 (сдвинуты)
        
        // Начальные и конечные позиции по оси X
        let startX1 = -2.0; // Левая стена
        let startX2 = 2.0;  // Правая стена
        let targetX1 = -0.6; // Точка сближения левой стены
        let targetX2 = 0.6;  // Точка сближения правой стены

        // Загрузка модели
        const loader = new THREE.GLTFLoader();
        loader.load(
            'model.glb',
            (gltf) => {
                wall1 = gltf.scene;
                
                // Первая стена (левая)
                wall1.position.set(startX1, 0, 0);
                scene.add(wall1);

                // Вторая стена (клонируем первую, разворачиваем шипами навстречу)
                wall2 = wall1.clone();
                wall2.position.set(startX2, 0, 0);
                // Разворачиваем вторую стену на 180 градусов по оси Y, чтобы шипы смотрели друг на друга
                wall2.rotation.y = Math.PI; 
                scene.add(wall2);

                document.getElementById('loading').style.display = 'none';
            },
            (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading').innerText = `Загрузка: ${percent}%`;
                }
            },
            (error) => {
                console.error('Ошибка:', error);
                document.getElementById('loading').innerText = 'Ошибка загрузки model.glb!';
            }
        );

        // Логика кнопки «Давить»
        const btn = document.getElementById('crush-btn');
        btn.addEventListener('click', () => {
            isCrushing = !isCrushing;
            btn.innerText = isCrushing ? 'Раздвинуть' : 'Давить';
        });

        // Главный цикл анимации
        function animate() {
            requestAnimationFrame(animate);

            // Плавное движение стен
            if (wall1 && wall2) {
                if (isCrushing) {
                    // Едут навстречу друг другу
                    if (progress < 1) progress += 0.02;
                } else {
                    // Возвращаются назад
                    if (progress > 0) progress -= 0.02;
                }

                // Интерполяция позиций (плавный ход)
                wall1.position.x = THREE.MathUtils.lerp(startX1, targetX1, progress);
                wall2.position.x = THREE.MathUtils.lerp(startX2, targetX2, progress);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Адаптация под поворот экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
